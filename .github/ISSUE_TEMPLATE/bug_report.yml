name: Bug report
description: Report a reproducible reliability, permission, or UI problem.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, personal screenshots, private logs, or Composio connection data.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.x
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact Felix action, question, and whether the foreground app was Chrome, Safari, or another app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
          required: true
