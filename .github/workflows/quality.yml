name: quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  # Keep pushes and manual runs from cancelling each other before a job starts.
  cancel-in-progress: false

jobs:
  swift:
    name: Swift and release quality
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm runner startup
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "swift=$(swift --version | head -n 1)"
          test -f Package.swift
      - name: Prepare writable Swift caches
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/felix-swift-cache"
          mkdir -p "$cache_root/package" "$cache_root/module" "$cache_root/clang"
          {
            echo "SWIFT_PACKAGE_CONFIG_DIR=$cache_root/package"
            echo "SWIFT_MODULECACHE_PATH=$cache_root/module"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$cache_root/module"
            echo "CLANG_MODULE_CACHE_PATH=$cache_root/clang"
          } >> "$GITHUB_ENV"
      - name: Test
        run: swift test --disable-sandbox
      - name: Shell syntax
        run: bash -n scripts/*.sh Launch-Felix.command
      - name: Public release audit
        run: ./scripts/public-audit.sh
